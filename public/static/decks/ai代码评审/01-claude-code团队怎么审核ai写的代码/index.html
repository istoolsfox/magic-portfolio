率和事故率是护栏——如果这两个数涨了，说明时间没省下来，只是挪了地方。"]}, {"type": "table", "kicker": "04", "title": "", "headers": ["风险等级", "典型例子", "需要几个人批准"], "rows": [["低", "文档、文案、仅内部可见的功能、藏在开关后面的纯新增改动", "自动审核和安全检查通过后，不需要人"], ["中", "普通的产品改动，以及缓存、自动更新器、系统提示词这类敏感区域", "一个人"], ["高", "风险最高的代码，加上一小批永远需要两个人的路径", "两个人"]]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底", "points": ["一个改动从工程师的笔记本（或者 Slack 里的一个 Claude 会话）出发，要穿过六层检查，最底下还垫着一层回滚。", "原文的图注说得直白：每一层都会抓住一些问题、漏掉一些问题，很少有问题能穿过全部六层，剩下的交给回滚。", "下面逐层拆。", "现在大部分审核发生在 PR 存在之前。"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["做法是给 Claude 一个它能自己跑的东西——测试、构建、或者一张和设计稿比对的截图——然后要求它展示输出，而不是说…", "接着换一个没看过过程的子代理，用新鲜的上下文审一遍 diff。", "开 PR 之前，很多人还会跑几个内部技能：一个专门找 bug，一个负责简化 diff，一个端到端检查行为是否正确。", "界面改动还要对照设计规范。"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["Claude Code 的创建者 Boris Cherny 把\"给 Claude 验证自己工作的手段\"称为拿到好结果最…", "当自动审核器反复标出同一类问题时，他们不在 PR 里一遍遍修，而是回到源头修：改技能、加 lint 规则、或者更新两份…", "CLAUDE.md 告诉 Claude 这个项目是什么：技术栈、约定、目标，以及明确不做的事。", "每次审核都会加载它，所以在大代码库里要保持简短，细节放到别的文档里再链接过去。"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["审核器还会标出两类东西：违背了里面某条约定的代码，以及让里面某一行过时了的改动。", "REVIEW.md 由代码负责人编写，告诉审核器\"我这块代码最在乎什么\"。", "团队会单独检查审核器是否真的照着做了。", "好的 REVIEW.md 都很短，要点是四条：说清这个仓库里\"失败\"长什么样（文档类是\"它在说谎\"，配置类是\"它把路由…"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["限制挑刺的数量", "列出可以跳过的路径", "要求给出文件和行号作为证据，而不是凭名字猜。", "最后还有一条小规矩：总结先报问题数量，没问题就直说没问题。"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["这一层的类比很简单：交作业之前自己先对一遍答案，再找一个没一起做题的同学帮你看一眼。", "每个 PR 在人看之前，都会先得到一次 Claude 审核。", "它把 diff 放在整个仓库和 PR 声明的意图里一起读，问三个问题：这个改动解决了它要解决的问题吗？", "和系统的其他部分合得上吗？"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["会不会弄坏别的东西？", "如果是修 bug 的 PR，它会去找根因。", "这个能力的公开版叫 Code Review for Claude Code，面向 Team 和 Enterprise …", "本地的 /code-review 命令是一个轻量版。"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["研究预览期间的数据是：内部 PR 收到实质性审核评论的比例从 16% 涨到了 54%。", "超过 1000 行的 PR 大多会有发现，小 PR 大多干净着回来。", "管理员可以给每个仓库设 Quick、Standard 或 Deep 三档，Deep 适合\"漏掉一个 bug 的代价远高…", "关键设计在于发现不直接发出来，先经过其他代理验证。"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["几个代理同时找 bug，然后另一组代理对每条发现投票，票数够了才贴出来。", "只涉及风格、诊断信息、清理的发现直接丢掉。", "这些过滤规则是先在他们自己的 PR 上做过 A/B 测试才保留的。", "最后留下的以行内评论出现，按严重度排序，每条标上 Important、Nit 或 Pre-existing——最后这个…"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["每一条发现都必须有回应：要么修掉，要么带着理由关闭线程。", "很多时候，代理会在夜里把修复做完，作者第二天回来，PR 已经多走了一轮。", "类比：三位阅卷老师各自独立打分，分歧大的题再合议，合议过的分数才写到卷子上。", "安全有自己独立的一道自动审核。"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["只要 bug 审核或安全审核里还有任何一条发现没关闭，PR 就不能合并。", "处理方式一样：修掉，或者用一句简短理由关掉线程，误报就是这样清除的。", "如果后面某个提交顺手把问题修了，那条发现会自动清除。", "想在自己的仓库里搭同样的东西，可以用开源的 security review GitHub Action 或 /secu…"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["这一层是老朋友：lint、类型检查、每个平台上的测试，还有构建。", "一个典型的命令行端 PR，在有人看之前可能已经跑了几十项检查。", "PR 模板里多了两个问题：\"这个改动怎么测的\"和\"怎么撤回\"。", "Claude 可以把答案填上，但要由发出这次改动请求的人签字确认。"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["一处文档修正和一处自动更新器的改动，风险完全不同，所以得到的审核也不同。他们的分级表是这样的", "有四条规则撑着这张表。", "第一，由改动决定级别，而不是由作者决定。", "一个分类器读改动内容来定级"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["第二个分类器单独问一句：这个改动是否无论级别如何都需要再加一个人？", "有些路径永远需要人——负责人标记为敏感的部分，以及任何 CI 工作流文件。", "第二，只有可信作者走轻量路径。", "仓库可信名单上的人（主要是负责这个仓库的团队）才能走低风险的免审路径，其他人一律需要第二个人批准。"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["而且代理的批准永远不算人的批准：自动审核可以放行一个低风险改动，但不能顶替任何一个要求由人来坐的位置。", "第三，谁下的指令，谁负责。一个由代理写出来的 PR，指挥代理的那个人算作必需审核者之一，和他自己敲的代码没有区别。", "第四，批准只对一个具体提交有效。", "如果后面落地了系统无法背书的新提交——比如代理又推了一次，或者有人手工解决了合并冲突——批准要重新给。"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["类比：银行转账的额度管理。小额免密，中额刷脸，大额要两个人的 U 盾，而且额度看的是这笔钱的大小，不是看谁在操作。", "合并队列会把改动叠在最新的 main 上，重新跑一遍所有检查。", "这是为了防一种事故：两个 PR 各自都能通过，合到一起却把 main 搞坏。", "新行为通常先藏在开关后面，只对 Anthropic 员工开放——他们自己是重度用户，很多回归在用户看到之前就被内部用出…"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["公开发布先走 latest 渠道，stable 渠道跟在后面。", "总有一些错误会穿过全部六层，所以最后一层的任务是尽快抓住它们。", "功能开关不需要部署就能关掉", "团队有每周轮换的值班"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["事故复盘要问的问题是\"哪一层本来应该抓住这个问题\"。", "这里原文有一段很诚实的话。", "发现一次坏合并，目前仍然依赖作者、值班的人，以及回滚和事故看板。", "他们还没有做出\"数字一变就自动收紧审批\"的熔断器，而工程师们希望在更多代码走向零人合并之前先把它做出来。"]}, {"type": "points", "kicker": "04", "title": "四、一个改动的一生：六层检查，外加一层回滚兜底（续）", "points": ["一位同事说，慢下来确实能降低错误率，但主要是因为什么都做得更少了。", "团队的回答是：我们宁愿更快地发现问题、更快地修。"]}, {"type": "points", "kicker": "05", "title": "五、审核器怎么越用越准", "points": ["这一节是整篇文章里最值得做 AI 审核工具的人反复读的部分。", "事故本身就是评测集。", "团队收集了历史上引发过事故的 PR，连同它们的向前修复和回滚记录，请熟悉那块代码的工程师逐条确认 bug 是什么、在哪…", "审核器每天都对着这个集合跑一遍，每次改审核器——换提示词、换工具、换模型——都要用全集重新打分。"]}, {"type": "points", "kicker": "05", "title": "五、审核器怎么越用越准（续）", "points": ["评测集随着每一次新事故持续增长。", "噪音要有办法量。", "只要不介意大量误报，抓更多 bug 并不难，所以必须有一个制衡。", "他们的办法是看人对每条评论做了什么：修了、说它错了、说这是故意的、还是说无所谓。"]}, {"type": "points", "kicker": "05", "title": "五、审核器怎么越用越准（续）", "points": ["另外还会把审核器放到已知干净的 PR 上跑，数它报出多少\"会诱导人去做有害修改\"的东西。", "优先级是白纸黑字写下来的：先抓真 bug，其次才是减少审核轮次。", "噪音对代理作者更贵。", "一个人看到一条无关紧要的挑刺，几秒钟就能挥手否掉。"]}, {"type": "points", "kicker": "05", "title": "五、审核器怎么越用越准（续）", "points": ["代理不会挥手，它会去修，于是多一个提交，再多一轮审核。", "审核必须收敛。", "一个代理当作者、另一个代理当审核，两个可以无限互相喂活。", "原文举了一个真实例子：命令行端的一个 PR 一夜之间跑了五十多轮审核和修复，直到作者把它停下。"]}, {"type": "points", "kicker": "05", "title": "五、审核器怎么越用越准（续）", "points": ["他们用 git blame 查审核器反复标出的东西，发现大约 59% 是审核器第一轮时就已经存在的旧代码——审核器很少…", "团队还承认这个问题有自己的责任：大家习惯了默认多跑几轮，因为每一轮都能\"发现点什么\"，这在高风险改动上值得，但不该用在…", "于是改了四条规则", "轮次上限。跑满三轮之后，审核器会请作者退一步，重新考虑整个思路。"]}, {"type": "points", "kicker": "05", "title": "五、审核器怎么越用越准（续）", "points": ["头几轮之后，只审新增的 diff。", "标出 bug 的类别，让作者一次修掉全部同类实例，而不是只改一行。", "已经贴过的发现不再重复贴。", "另外，审核代理会在夜间扫一遍存量代码，把旧 bug 在别处冒头之前先挖出来。"]}, {"type": "points", "kicker": "05", "title": "五、审核器怎么越用越准（续）", "points": ["审核漏掉了东西时，他们问的问题也不是\"怪谁\"，而是\"模型当时没看到什么\"，然后把答案放进 CLAUDE.md、技能或新…", "类比：烟雾报警器。", "灵敏度调太高，天天被烤面包触发，住户迟早把电池拔了。", "可用的报警器不是最灵敏的那个，而是误报少到人愿意一直开着的那个。"]}, {"type": "points", "kicker": "06", "title": "六、人还留在哪几个位置", "points": ["把一位资深工程师从深度工作里拽出来抓一个常规错误，代价远远高于一次自动审核。所以团队成员仍然负责的，是这五件事", "决定要不要做。", "方向、品味、范围。", "有一个团队宣布审核瓶颈已经解决，但仍然保留了对团队外部改动的人工审核，为的是有人问一句\"我们到底该不该做这个\"。"]}, {"type": "points", "kicker": "06", "title": "六、人还留在哪几个位置（续）", "points": ["审高风险代码。计费、自动更新器、CI 工作流。", "审会被别人抄的架构。一个定下模式的改动，后面会有很多人照着写。", "读证据。", "测试输出、跑了什么命令返回了什么、截图、审核器的发现。"]}, {"type": "points", "kicker": "06", "title": "六、人还留在哪几个位置（续）", "points": ["原文给了一条判断标准：如果你说不出这些检查会漏掉什么，就去要一次真正的审核，而不是快速点个批准。", "对结果负责。每一个上线的改动都有一个人在为它负责，不管代码是谁敲的。"]}, {"type": "points", "kicker": "07", "title": "七、机器读了代码，人怎么学代码", "points": ["审核历来还有第二个职能：在团队里传播对代码库的理解。", "读同事的 diff，就是在学什么变了、各部分怎么拼在一起。", "如果大部分阅读交给了机器，人怎么学？", "他们的回答很坦率：没有正式流程。"]}, {"type": "points", "kicker": "07", "title": "七、机器读了代码，人怎么学代码（续）", "points": ["团队里没有人脑子里装着 Claude Code 的完整模型，他们也不认为需要有。", "想弄懂某一块代码时，就让 Claude 针对那一片写一份讲解，几分钟出来，反映的是今天的代码。", "有人更进一步，让 Claude 做一个小的可视化作品，按自己喜欢的方式把那块代码讲一遍。", "这背后的逻辑和前面一致：如果目标是把人的注意力花在值得的地方，这种方式胜过逐行读琐碎的 diff。"]}, {"type": "points", "kicker": "07", "title": "七、机器读了代码，人怎么学代码（续）", "points": ["一处一行文案的改动教不了你什么，而针对你马上要改的模块写一份讲解，能教你很多。", "团队默认在公开的 Slack 频道里干活，大家一边造一边看别人在造什么，这也在替代传统审核的传播作用。"]}, {"type": "points", "kicker": "08", "title": "八、\"谁合的谁负责\"，以及什么时候该放弃", "points": ["如果你合并了一个中小改动，之后出了问题，团队惯例是通常由你来修。", "有几件事让这个惯例不至于变成压力源：改动小，所以好审、好查、好撤", "一切可逆，开关、回滚和分阶段发布能在几分钟内撤销大多数错误", "爆炸半径决定门槛，贵的代码配更多人和更多检查"]}, {"type": "points", "kicker": "08", "title": "八、\"谁合的谁负责\"，以及什么时候该放弃（续）", "points": ["回归通过遥测和内部使用很快浮出来", "这不是追责，谁来修是因为谁的上下文最多，复盘看的是系统。", "还有一条很少有人写进流程里的事：有些工作不该落地。", "代理让\"开工\"变得很便宜，所以总会有不该做的东西被做出来。"]}, {"type": "points", "kicker": "08", "title": "八、\"谁合的谁负责\"，以及什么时候该放弃（续）", "points": ["通常是频道里有人问一句为什么、指出一个更早的决定、或者提出一条更简单的路，作者就把 PR 关掉或者改方向。", "因为代码写得快，关掉 PR 不觉得可惜。", "他们的经验是：要在线程里早点提出不同方向，而不是等 PR 做完了再去堵。"]}, {"type": "points", "kicker": "09", "title": "九、你的团队怎么照抄：一张分四段的清单", "points": ["原文最后给了一份落地清单，说大部分零件今天就能拿到。我按原文的四段整理，你可以直接照着勾。", "PR 之前", "写一份短的 CLAUDE.md，列出代理可以自己跑的检查；配上自动跑格式化和 lint 的 hook。", "在本地跑 /code-review 和 /security-review，或者让一个新上下文的子代理审一遍。"]}, {"type": "points", "kicker": "09", "title": "九、你的团队怎么照抄：一张分四段的清单（续）", "points": ["加一份 REVIEW.md，把反复出现的审核评论搬进去。", "每个 PR", "必须过 CI；在 PR 模板里加上\"测试\"\"风险\"\"怎么撤回\"三栏。", "先在一个仓库上 AI 审核器，花几周调 REVIEW.md，再铺到其他仓库。"]}, {"type": "points", "kicker": "09", "title": "九、你的团队怎么照抄：一张分四段的清单（续）", "points": ["加自动安全审核，并要求所有审核线程解决之后才能合并。", "审核力度和风险匹配：常规改动快过，漏一个 bug 代价高的地方深审。", "给审核轮次设上限；头几轮之后只审新 diff。", "审批"]}, {"type": "points", "kicker": "09", "title": "九、你的团队怎么照抄：一张分四段的清单（续）", "points": ["把风险分级写下来，级别由改动决定而不是由作者决定；先从严，拿到证据再放松。", "轻量审批路径只给可信作者。", "用 CODEOWNERS 和分支保护，让鉴权、计费、CI 和发布工作流、安装器永远需要一个人。", "永远不让机器人的批准顶替一个必需的人；新提交落地后作废旧批准。"]}, {"type": "points", "kicker": "09", "title": "九、你的团队怎么照抄：一张分四段的清单（续）", "points": ["合并之后", "合并队列、功能开关、内部先用、分阶段发布、一步回滚。", "把事故和回滚变成评测集；审核器的提示词、工具或模型一变就重新打分。", "度量人的时间，把回滚率和事故率当护栏。"]}, {"type": "points", "kicker": "10", "title": "十、边界，先说清楚", "points": ["这套做法有它的土壤，照抄之前要看清三点。", "第一，这是前沿实验室的内部实践：模型调用近乎不限量，团队高度可信，而且审的就是自家的产品和自家的模型。", "Hacker News 上的讨论里，不少人质疑这套流程能否推广到 token 预算有限的普通团队。", "第二，原文自己承认了几处未完成：没有熔断器"]}, {"type": "points", "kicker": "10", "title": "十、边界，先说清楚（续）", "points": ["\"零人合并\"的边界还在移动", "发现坏合并仍然靠人和看板。", "这是一套还在演进的流程，不是定稿。", "第三，所有数字都是 Anthropic 的自述。"]}, {"type": "points", "kicker": "10", "title": "十、边界，先说清楚（续）", "points": ["% 到 54%、翻倍、降 40%、59%，这些都没有外部审计。", "引用时注明\"据原文\"，不丢人，反而严谨。", "对于小团队，我的建议是先抄成本最低、收益最直接的三样：PR 之前让代理自证并展示输出", "写一份 REVIEW.md 把反复出现的评论固化进去"]}, {"type": "points", "kicker": "10", "title": "十、边界，先说清楚（续）", "points": ["把风险分级写下来并按改动而不是按作者定级。", "这三样不需要买任何产品。"]}, {"type": "table", "kicker": "11", "title": "", "headers": ["问题", "Claude Code 团队的答案"], "rows": [["审核在防什么", "不是\"有没有人读过\"，而是\"这个改动可能出什么错，哪道检查最适合抓它\""], ["什么是稀缺资源", "人的时间和注意力，而且要算审核和修复两头"], ["流程长什么样", "六层检查（PR 前自证、AI 审核、安全审核、自动检查、按风险分级的人工审批、合并队列与灰度）加一层快回滚兜底"], ["人审什么", "要不要做、高风险代码、会被抄的架构、读证据、对结果负责"], ["审核器怎么进步", "事故变评测集每天跑；按人对评论的反应量噪音；三轮上限、只审新 diff、按类别标 bug、不重复"], ["成绩", "6 到 9 月合并 PR 翻倍以上，回滚比例降 40% 以上（原文自述）"]]}, {"type": "points", "kicker": "12", "title": "十二、行动清单", "points": ["今天就给你的仓库加一份 REVIEW.md：写清\"这里的失败长什么样\"、要文件加行号的证据、总结先报数量。", "下一个让 AI 写的功能，要求它贴出测试或构建的输出，而不是只说\"做完了\"。", "把团队的审批规则写成三行风险分级表，按改动内容定级。", "开始记三个数：每个 PR 的人工审批数、人工评论数、等人时长；同时盯住回滚率。"]}, {"type": "points", "kicker": "12", "title": "十二、行动清单（续）", "points": ["如果你在做 AI 审核工具：把你们的事故记录整理成评测集，先于任何提示词调优。", "最后用原文的一句话收尾：大多数路径是自动的，人的注意力去风险所在的地方。", "审核从来不是\"有人读过就安全\"，而是\"每个改动花了多少人的时间，而事故没有变多\"。", "原文：How the Claude Code team does code review，Addy Osmani、Mo…"]}, {"type": "close", "title": "Claude 写了 90% 的代码，谁来审？Claude Code 团队的审核流程拆解", "takeaways": ["一、结论先行", "二、先换一个问题：审核到底在防什么", "三、稀缺资源是人的时间，而且要算两头"]}], "accent": "#46668c", "title": "Claude 写了 90% 的代码，谁来审？Claude Code 团队的审核流程拆解", "seed": 9040, "home": "../../../../", "article": "../../../../ai代码评审/01-claude-code团队怎么审核ai写的代码.html"}</script>
