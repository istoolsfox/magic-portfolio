于是 agent 会欣然写出两三个辅助方法去完成一个方法能干完的事，会机械地套用\"别重复自己\"原则，把两段只是长得像的…"]}, {"type": "points", "kicker": "03", "title": "三、AI 到底把代码搞脆在哪里：四个机制（续）", "points": ["它不是笨，是考试从来不考节制。", "这解释了为什么 AI 写的测试也浅：测试数量能刷分，\"恰到好处的测试\"没有分数。", "人类世界有一台最古老的过度设计刹车：每多写一行代码，就多十分钟工作量、多一处将来要维护的地方，这个成本即时可见，所以人…", "AI 没有这台刹车。"]}, {"type": "points", "kicker": "03", "title": "三、AI 到底把代码搞脆在哪里：四个机制（续）", "points": ["对它来说写 200 行和写 20 行的成本几乎一样。", "讨论区有句话说得极准：\"人类会因为烂代码库辞职，AI 不在乎，它会乐意在一个混乱的代码库里永远搅下去。", "\"人类靠厌恶感守住的最低质量线，在 AI 这里不存在。", "Agent 能看见的是当前会话和当前文件。"]}, {"type": "points", "kicker": "03", "title": "三、AI 到底把代码搞脆在哪里：四个机制（续）", "points": ["架构级的腐化——第 17 次重复造出来的工具函数、慢慢漂移的命名约定——散落在几千次提交里，任何单次会话都看不见。", "更麻烦的是连锁反应：讨论区一位运维工程师的实测是，把 agent 放进一个已经混乱的代码库，新 agent 会把上一个…", "文章作者的判断也指向这里——他在 Meta 做过用 AI 大规模治理代码质量的工具，结论是\"脆弱性藏在比上下文窗口更大…", "正常的软件工程有个闭环：人写、人读、人维护，痛了就改。"]}, {"type": "points", "kicker": "03", "title": "三、AI 到底把代码搞脆在哪里：四个机制（续）", "points": ["AI 编码把这个闭环剪断了。", "写的人不读（agent 写完就忘），读的人不写（纯指挥的人没碰过代码），痛的用户反馈要绕很远才传回来。", "还有一类错误更隐蔽：人类 bug 通常会崩溃，你看得见", "AI 的 bug 常常是\"静默地解错了问题\"——功能不崩，只是不是你要的那个。"]}, {"type": "points", "kicker": "03", "title": "三、AI 到底把代码搞脆在哪里：四个机制（续）", "points": ["没有崩溃就没有报警，损害在水面下积累。", "文章那四个征兆（事故渐增、恢复变慢、用户先看到错、体验劣化）全是断环的下游症状。"]}, {"type": "table", "kicker": "04", "title": "", "headers": ["现实中的做法", "对应的 AI 时代做法", "防什么"], "rows": [["编码规范 + 新人手册", "AGENTS.md 约束文件，写可判定规则", "AI 顺手加戏、过度设计"], ["CI 流水线 + 测试", "确定性门禁：lint、类型、测试、体积，先测后码", "浅薄测试、静默错误"], ["代码交叉评审", "对抗性评审：独立上下文红队，分视角找茬", "确认偏误、幻觉 API、半修"], ["模块化 + 接口约定", "模块化单体，接口先行，定期删代码", "腐化扩散、爆炸半径失控"]]}, {"type": "points", "kicker": "04", "title": "四、解法：把现实中的工程管理搬给 agent", "points": ["把讨论区几十条实践经验收拢，会得到一个四层防线。", "每一层都对应一个人类团队已经用了几十年的管理工具，我逐层讲它防什么、怎么搭。", "人类团队有编码规范和新人手册，AI 时代对应物是仓库根目录的约束文件（AGENTS.md、CLAUDE.md 这类，各…", "别把它写成空话，要写成可判定的规则。"]}, {"type": "points", "kicker": "04", "title": "四、解法：把现实中的工程管理搬给 agent（续）", "points": ["讨论区一位工程师分享的写法被广泛认可，翻译过来是：\"贡献者必须遵守 YAGNI、DRY、KISS 和最小惊讶原则。", "代码是负债。", "不做任何没被明确要求的东西。", "\""]}, {"type": "points", "kicker": "04", "title": "四、解法：把现实中的工程管理搬给 agent（续）", "points": ["四个缩写展开一下。", "YAGNI（You Aren't Gonna Need It）：不为\"将来可能用到\"提前写代码。", "DRY（Don't Repeat Yourself）：同一逻辑只写一处——但对 AI 要小心，它会把只是长得像的代码硬…", "KISS（Keep It Simple, Stupid）：怎么简单怎么来，判断标准是三个月后自己还能不能十秒看懂。"]}, {"type": "points", "kicker": "04", "title": "四、解法：把现实中的工程管理搬给 agent（续）", "points": ["最小惊讶原则：代码行为要符合读它的人的预期，别写出\"名字叫查询、内部偷偷写库\"的惊喜。", "除了原则，还该写死项目级决策：错误处理策略、浏览器兼容策略、依赖引入规则。", "Chrome 团队的现代 Web 技能文档甚至建议开发者把\"允许多新的特性、回退代码不超过 20 行\"这类口径明确写进…", "门禁是自动检查关卡，\"确定性\"的意思是机器判定、没有主观空间：lint 报错就是报错，测试红了就是红了，类型检查不过就…"]}, {"type": "points", "kicker": "04", "title": "四、解法：把现实中的工程管理搬给 agent（续）", "points": ["人类团队靠 CI 流水线干这事，AI 时代一模一样，只是每一道闸都比以前更重要，因为产量翻了十倍。", "具体怎么搭，四道闸从便宜到贵排：静态检查（lint、类型）最先跑，秒级，拦住低级错误", "单元测试第二道", "集成测试第三道"]}, {"type": "points", "kicker": "04", "title": "四、解法：把现实中的工程管理搬给 agent（续）", "points": ["性能和体积预算做最后一道。", "讨论区实践者给的搭配是\"小步 + 先写测试\"：每次只让 agent 改一小块，而且先写测试再写代码。", "顺序反过来是有讲究的——先写测试就把\"测试是需求\"钉死了，AI 没法在写完代码之后再编一个\"正好通过\"的测试糊弄你。", "我自己维护的几个小工具就是这么跑的：一个 shell 门禁脚本把 lint、单测、构建全串起来，任何改动过不了闸就不算…"]}, {"type": "points", "kicker": "04", "title": "四、解法：把现实中的工程管理搬给 agent（续）", "points": ["这套东西二十年前叫 CI，今天一个字不用改，照搬给 agent。", "这是四层里最有意思的一层。", "写代码的 agent 检查自己的产出，等于学生批改自己的考卷——它会不自觉地为代码辩护，这叫确认偏误。", "解法是人类世界早就验证过的老办法：交叉审。"]}, {"type": "points", "kicker": "04", "title": "四、解法：把现实中的工程管理搬给 agent（续）", "points": ["NASA 的实验研究（Basili 等人 1996 年的视角化阅读实验）证明，给审查者分配明确视角，比\"随便看看\"能查…", "Google 的工程实践手册和这个结论一致。", "搬到 AI 上的做法：把待审代码交给一个没有任何上下文的新会话，让它扮演一个只负责找茬的独立审查者，和作者不共享大脑。", "我自己在开源贡献里用了快两个月的模板就是七视角：正确性维护者盯逻辑和边界条件，完整性审查者盯\"是不是修了一半\"，文档读…"]}, {"type": "points", "kicker": "04", "title": "四、解法：把现实中的工程管理搬给 agent（续）", "points": ["每条发现必须带文件行号或命令输出当证据，最后强制给出裁决：放行，或者先修再放。", "实际效果：这套流程在发车前抓出过幻觉 API（模型凭印象写了不存在的方法）、抓出过\"修对一半\"的半成品、抓出过把无关改…", "人只裁决机器和红队判不了的分歧，这就是第 3 层的分工。", "前三层管住单次改动，第四层管累积效应。"]}, {"type": "points", "kicker": "04", "title": "四、解法：把现实中的工程管理搬给 agent（续）", "points": ["人类团队的办法是模块化：把系统切成边界清晰的模块，模块之间只通过明确定义的接口通信。", "这个结构对 AI 有一个额外的好处——爆炸半径可控。", "Agent 在 A 模块里放火，接口是防火墙，烧不进
