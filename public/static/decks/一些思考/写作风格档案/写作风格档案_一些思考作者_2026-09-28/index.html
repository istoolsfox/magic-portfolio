<script type="application/json" id="deck-data">{"slides": [{"type": "cover", "title": "一些思考作者 写作风格", "category": "一些思考", "meta": "约 15 分钟 · 6126 字 · 5 节"}, {"type": "toc", "items": ["一、句子层", "二、用词层", "三、过渡层", "四、姿态层", "五、总闸"], "targets": [2, 11, 22, 26, 33], "more": 0}, {"type": "points", "kicker": "01", "title": "一、句子层", "points": ["陈述性的段从段首一路逗号连到段尾，中途不落句号，段尾也不加句号。", "全篇 12 段中 9 段零句末标点", "句号全篇只有 1 个、分号 1 个。", "信息密度最高的论证段反而最长：第 2 段 293 字、第 5 段 276 字、第 8 段 219 字，全部一段到底不切…"]}, {"type": "points", "kicker": "01", "title": "一、句子层（续）", "points": ["语料证据", "作用：保住一口气想到底的思路流。逗号在这里不是停顿而是推进器，读者的呼吸被作者的呼吸带着走，思路不重启、不散架。", "边界：重标点只在两种情况落（见 1.3）", "分号全篇只用过一次，在段内隔开「现在」与「以前」两半（正文第 2 段「可以拿它卖钱、炫耀技术等等"]}, {"type": "points", "kicker": "01", "title": "一、句子层（续）", "points": ["在以前的时候」），不是常规工具。", "矛盾语料如实记：第 10 段（第二种方案段）是唯一以句号收尾的陈述段，与「段尾裸奔」主律不一致，属偶发回归规范标点。", "平均单位 9.5 字，86.4% 不超过 14 字，超过 20 字的仅 5 处（其中 3 处内含顿号列举，顿号一拆又回…", "一旦要罗列，就用同构短拍一路排下去，不合并、不浓缩。"]}, {"type": "points", "kicker": "01", "title": "一、句子层（续）", "points": ["作用：制造口语节拍；同构短拍排比还能撑出「数量多、覆盖广」的气势，比一个长句概括更有说服的架势。", "边界：段落起手允许一个长单位领总起句再转入短拍，如「我们现在可以随时依靠AIvibe coding一个小软件、小程序出…", "全篇 ！×2、？×1，全部落在情绪顶点和设问处，其余位置一律平调逗号。", "作用：全文标点语调是平的，重标点像鼓点，越少越响——真正兴奋处（描绘自己理想中的 App）和设问推进处才敲一下。"]}, {"type": "points", "kicker": "01", "title": "一、句子层（续）", "points": ["边界：批评最狠的地方也不用重标点，「那更是完蛋」两连发全程逗号平说（第 6 段）；陈述、让步、转折处一律不落 ！/？。", "几乎每个论证动作都架在「在以前……（但是）现在……」的对撞轴上，「以前」×8、「现在」×9，每换一个论点就重新对撞一次。", "作用：把「时代变了」这个论证引擎落成固定句式：以前为靶、现在为箭，对撞本身完成论证，不需要另起论证句。", "边界：用在论证起手处；纯展开处（第一种/第二种方案，第 9、10 段）不再对撞；回望历史时换用 1.6 的沿革两段式。"]}, {"type": "points", "kicker": "01", "title": "一、句子层（续）", "points": ["第三处变体用「其实」起段完成同样的先抬后压：> 其实有生态的软件，他们也不能产生高枕无忧的想法（来源：正文第 7 段段…", "作用：先把对方（或常识）的道理说半句，显得公允不偏激，随后用「但是/那更是/其实」把真实态度顶出来", "补刀句永远比让步句狠。", "边界：让步只给半句不展开；只对无争议的事实让步（「开发有成本」「新版本好多了」），观点主场从不让。"]}, {"type": "points", "kicker": "01", "title": "一、句子层（续）", "points": ["回望行业史时压成固定两拍：封闭的过去 →「随后」→ 松动的现在。", "作用：把行业史压缩成两拍叙事，为「那么在AI时代也必然如此」这类推论铺轨——历史讲完，结论自己就站住了。", "边界：只用于回望历史处；展望未来时换用「必定/必将/一定/必然」直接断言（见 2.4），不再讲故事。", "作用：方案清单和思维实验都靠编号逐个报数推进，全篇不用项目符号、不用加粗、不分点，编号嵌在逗号流里，保住「说话」而不是…"]}, {"type": "points", "kicker": "01", "title": "一、句子层（续）", "points": ["边界：只到「第一种/第二种」的量级", "更细的展开直接并入逗号流不再编号。", "全文唯一接近列表的排版是顿号（×15），且只用于专名清单。"]}, {"type": "quote", "text": "现在，我们已经见识到了AI的恐怖之处了，从刚开始的弱智，再到编程辅助，再到LLM，最后到现在的vibe coding时代，AI已经很强了，并且AI的表现还是爆炸式的，影响力十分恐怖（来源：本篇·正文第 1 段，整段 8…"}, {"type": "table", "kicker": "02", "title": "", "headers": ["缺席词", "替身（在场次数）"], "rows": [["然而 / 不过 / 可是", "但是 ×5"], ["因此 / 所以 / 于是 / 总之", "无替身，靠语序硬接；路标用那么 ×6"], ["非常 / 特别 / 超级", "十分 ×3"], ["例如 / 譬如", "比如 ×5、像是 ×2"], ["你们 / 朋友们 / 各位（呼语）", "无呼语，读者以「用户/人们/每个人」被谈论"], ["首先 / 其次 / 最后", "第一种/第二种"], ["emoji、加粗、项目符号", "无，正文零排版装饰"]]}, {"type": "points", "kicker": "02", "title": "二、用词层", "points": ["语气词合计密度 2.7/千字（呢×3、来着×2、吧×1、哦×1", "哈/嘛/啊/啦/嘿嘿/嗯全为 0）。", "仅有的几个各守一个岗位：忘词（来着）、想起（哦）、追问连发（呢）、自我宽慰（吧）。", "语料证据"]}, {"type": "points", "kicker": "02", "title": "二、用词层（续）", "points": ["作用：口语感不靠撒语气词，靠逗号节奏和现场自语（见 4.2）；语气词只出现在「人味」最浓的瞬间，所以每一个都有分量。", "边界：陈述论证中一个语气词都不加；「呢」只用于「X 呢」追问链这一种句型。", "「比如」×5、「像是」×2，「例如/譬如/诸如」为 0；例子全是真实产品的裸名，不加任何说明注解。", "作用：例子承担论证重量——不解释、直接点名，默认读者都认识，省下的笔墨全部让给态度表达。"]}, {"type": "points", "kicker": "02", "title": "二、用词层（续）", "points": ["边界：想不起名字时不写「某软件」含糊过去，而是把忘词过程原样写出来（见 4.2）。", "「等等」×6、「一些」×11，是全篇最高频的两个「不求穷尽」词。", "作用：清单不追求穷尽，「等等」「一些」一扫就过，表示「还有一堆，意思到位即可」，和 1.2 的短拍列举配套使用。", "边界：核心论点词（生态、vibe coding、改变世界）从不加「等等」虚化；模糊词只罩配角信息。"]}, {"type": "points", "kicker": "02", "title": "二、用词层（续）", "points": ["「可能」×6 全部压在事实性数字和他人反应上；趋势判断全用强断言词（必定/必将/一定/必然合计×5）。两套词分工清楚。", "作用：给数字留余地（思维实验经不起较真），给方向上强度（立场要喊响），两种语气各管一摊，读者能分清哪些是估算、哪些是信…", "边界：当下的具体体验用「十分」系（见 2.7），不用「可能」。", "矛盾语料如实记：第 4 段「但是这0.1的人，可能会改变世界」是全文最重的趋势判断，反而用了「可能」，是分级规律下唯一…"]}, {"type": "points", "kicker": "02", "title": "二、用词层（续）", "points": ["「但是」×5（然而/不过/可是为 0），「那么」×6（因此/所以/于是为 0）。", "作用：只用最口语的两枚连接词，因果和递进全靠语序硬接（「并且在小规模的代码开发商，基本上不会出错，这意味着什么？", "」），不用一个书面逻辑词。", "边界：「那么」既做段内小翻页（「那么Adobe这样了」，第 6 段）也做段尾引出（上例），跨段大转折则由「但是/其实」…"]}, {"type": "points", "kicker": "02", "title": "二、用词层（续）", "points": ["作用：好恶判断全部用体感大白话（完蛋、一坨、难受、难用、恐怖、找不着北），不说「体验不佳」「竞争壁垒」这类评论术语——…", "边界：书面判断词只有四字格一种渠道，且一处一枚（见 2.7）。", "「十分」×3（十分之高、十分恐怖、十分方便快捷）", "四字格全篇 7 处各不重复：无可厚非、高枕无忧、固步自封、眼花缭乱、轻而易举、齐聚一堂、找不着北。"]}, {"type": "points", "kicker": "02", "title": "二、用词层（续）", "points": ["作用：「十分」是个略老派但绝对口语安全词，顶替所有「非常/特别/超级」；四字格给口语流加一点书面分量，一处一枚像撒葱花。", "边界：不用非常/特别/超级/贼", "四字格不连用。", "矛盾语料如实记：第 7 段同时出现「固步自封」「顺应时代的改变而改变出来的」两处书面表达，是全书语域最「文」的一段，与…"]}, {"type": "points", "kicker": "02", "title": "二、用词层（续）", "points": ["「API」「内存」「按需加载」「开发者平台」「闭环」等词同样裸用不解释。", "作用：默认读者是同行或深度用户，黑话裸奔本身是一种圈内人信号，和「构建/做/改/接入/定制/加载」这批大白话动词混着用…", "边界：只对软件从业者的默认词生效；解释性内容（括号注解）只用过一次且极短——「（这里指用一次也算用）」，第 4 段。", "作用：缺席即风格——所有书面语逻辑装备被两三枚口语词顶替，读感统一，不会在「书面段」和「口语段」之间跳档。"]}, {"type": "points", "kicker": "02", "title": "二、用词层（续）", "points": ["边界：唯一保留的书面排版是「## 一、」章节标题；顿号清单是仅存的书面列举工具。"]}, {"type": "quote", "text": "我有些忘了，哦对了，还有微软生态（来源：正文第 5 段，「哦」=想起岗位）"}, {"type": "points", "kicker": "03", "title": "三、过渡层", "points": ["下一段的开头直接抓住上一段结尾抛出的话头：预告就报号、论断就举例、铺垫就翻转。", "四种咬合全部在场：预告→报号（第 8→9 段）、论断→举例（第 5→6 段）、铺垫→翻转（第 2→3 段、第 6→7 …", "语料证据", "作用：段与段之间没有「接下来/下面/说回」这类空转词，续力全靠内容咬合，读起来像有人接着你的话往下说，段落虽长但接力不…"]}, {"type": "points", "kicker": "03", "title": "三、过渡层（续）", "points": ["边界：段内小翻页用「那么」，跨段翻转用「但是/其实」起段（见 2.5 边界）", "章节级过渡无法提炼——语料只有一个章节，如实跳过不凑。", "全篇「生态」×19、「软件」×21、「自己」×17、「改变(了)世界」×5、「vibe」×4、「拥抱」×3、「以前/现…", "作用：长文不跑题靠锚词回旋：论点词像副歌隔几段唱一遍，把散掉的段落拴回主轴"]}, {"type": "points", "kicker": "03", "title": "三、过渡层（续）", "points": ["「改变世界」在第 4 段段尾预告、第 5 段整段展开，形成前后钩连。", "边界：回敲的是论点词和短语，不是整段复述", "同一论据（伯纳斯-李/Linux）只用一次不复读——「回旋引用」在这个作者这里是词汇级的，不是案例级的。"]}, {"type": "quote", "text": "那么在AI时代的今天，我觉得应该有两种解决办法（第 8 段段尾）→ 第一种那就是自定义，所有的东西都是自定义，用户可以自己决定放什么东西（第 9 段段首）"}, {"type": "points", "kicker": "04", "title": "四、姿态层", "points": ["「我」×31（含我们 ×4）只管自己的意愿、动作和判断", "「他们」×10 一律指大厂/公司", "「你」×3 不喊读者，而是把某一方临时推上台", "「我们」×4 = 作者加同代人。"]}, {"type": "points", "kicker": "04", "title": "四、姿态层（续）", "points": ["「你们/朋友们」为 0。", "语料证据", "作用：人称站位就是立场：自己永远坐用户席，商业公司永远用第三人称被谈论，需要代入感时把当事方推上「你」的位置，读者始终…", "边界：「你」从不对读者下指令，全篇没有「你应该/你需要」"]}, {"type": "points", "kicker": "04", "title": "四、姿态层（续）", "points": ["对读者的呼吁全部借趋势断言完成（「未来必定是这个趋势」），不用祈使句。", "另有若干笔误原样留在正文（「技术和时间的显示」应为限制、「AIv进行ibe coding」为词序颠倒、「0,1」应为 …", "作用：制造「没打草稿、边想边打」的现场感——作者愿意把思考的毛边原样暴露，姿态是「记录一场思考」而不是「发表一篇结论」…", "边界：卡壳只发生在配角信息（产品名、年份）"]}, {"type": "points", "kicker": "04", "title": "四、姿态层（续）", "points": ["主论点和关键数字从不卡壳，且忘词多半会自己接回来（「哦对了，还有微软生态」）。", "作用：重复不当累赘删——同义改写会打断语流，原句复述既是强调也是续气", "「那更是完蛋」两连用甚至带出节奏回环。", "判断依据：全篇所有重复处没有一处被换成别的说法，作者对「三步之内说三遍」毫无心理负担。"]}, {"type": "points", "kicker": "04", "title": "四、姿态层（续）", "points": ["边界：重复限于相邻句内（自我复述）和同段内（同一短语回环）；跨段不复述上一段内容——跨段的续接交给 3.1 的接话头。", "暴露失败：✓，以「卡壳留纸上」的形式出现共 5 处（4 处忘词 + 1 处语序漏字），见 4.2。", "标注边界：✓，开篇第 0 段即对标题本身的完成度标注不确定，等于告诉读者「这是一篇进行中的思考」。", "让功给别人：✗ 语料中未出现（无引用、无出处标注、无「有人说」式转述）。"]}, {"type": "points", "kicker": "04", "title": "四、姿态层（续）", "points": ["主动标广告：✗ 语料中未出现（本篇无推广内容）。", "前两项与 1.5 的先让步再补刀配合，构成这个作者的信任结构：先自曝毛边，再让半句公道话，然后才下重判断。"]}, {"type": "quote", "text": "如果我想要一些更深度的功能，那不好意思，请选择你的会员等级，他们要求我要付费了（来源：正文第 2 段——一句话里三个称各就各位：我=想要的人，你=被推着买会员的用户，他们=收费的大厂）"}, {"type": "points", "kicker": "05", "title": "五、总闸", "points": ["写完念一遍：如果你听见的是「一个人在旁边现场说话」——会忘词、会自己接回来、会在「但是」后面补刀、一口气不落句号顶到段…", "反过来，只要冒出一个「因此」、一个「首先」、一个用句号切得四平八稳的长句，就出戏了。"]}, {"type": "close", "title": "一些思考作者 写作风格", "takeaways": ["一、句子层", "二、用词层", "三、过渡层"]}], "accent": "#c2504a", "title": "一些思考作者 写作风格", "seed": 2946, "home": "../../../../../", "article": "../../../../../一些思考/写作风格档案/写作风格档案_一些思考作者_2026-09-28.html"}</script>
