（转写原话，用引号）（续）", "points": ["\"AI 不是对女性有很大威胁的东西，它很可能是一个帮女性忙的东西。\"——张悦", "\"AI 是咱们自己喂养出来的。你喂给它什么，它最后就怎么想。\"——张悦", "\"也许技术的门槛下降了，真正需要跨越的是心理的门槛。\"——詹青云", "\"不能只相信它不会坑我们，而是要把它塑造成不会坑我们的样子。\"——詹青云"]}, {"type": "points", "kicker": "04", "title": "金句原话（转写原话，用引号）（续）", "points": ["\"作为女性，留在牌桌上的参与，不一定要成为高管、带头人——只是不断地去表达，本身就是塑造它的一个过程。\"——詹青云"]}, {"type": "points", "kicker": "05", "title": "这场的意义", "points": ["对行业，这场论坛把\"AI 与女性\"从口号拆成可操作的三层。", "第一层是评测口径：171 年差距、44% 系统含偏见的数据，加\"做家务/创新者\"探针，把算法偏见定义为可检测的产品缺陷…", "第二层是行动方法论：白皮书用\"创业行动转化率 20%\"分开测量意愿与落地，指出全女性团队获 VC 仅个位数、女性决策人…", "第三层是需求洞察：喂鱼投喂量 AI、合租搭子匹配、策展人的\"全量语料记忆搭档\"都在说同一个道理——真正的 AI 机会不…"]}, {"type": "points", "kicker": "05", "title": "这场的意义（续）", "points": ["对个人，全场反复在讲：技术门槛在下降，心理门槛才是新瓶颈。", "冒名顶替综合症、\"100% 准备好了才敢上\"、害怕失败——不是能力问题，是安全感问题", "而安全感一半由外部组织给（VC 兜底、陪跑机制、伴暖这样\"焦虑时可以去的组织\"），另一半靠自己练——ACT 六过程就是…", "范可新用 24 年注脚：长期主义允许低谷，不轻易停下。"]}, {"type": "points", "kicker": "05", "title": "这场的意义（续）", "points": ["最后留一个准则：AI 是被喂养出来的，它长成什么样取决于谁在表达——女厕所的教训是\"不参与设计，世界就不会按你的需求运…", "AI 时代的推论是\"不去表达、不去塑造，偏见就会被下一代模型继承和放大\"。"]}, {"type": "close", "title": "166-智创她力量女性论坛", "takeaways": ["这场为什么开（背景与定位）", "全场脉络（环节清单，一行一个：讲者 — 主题）", "逐环节超详细还原"]}], "accent": "#0e8f96", "title": "166-智创她力量女性论坛", "seed": 1078, "home": "../../../../../../", "article": "../../../../../../云栖大会/2026-09-22-第一天/166-智创她力量女性论坛/超详细总结.html"}</script>
