话\"。", "展开：loss 只算回答部分（否则模型学会复述问题）。千到万条数据就能显著改变行为。", "记忆锚点：岗前培训，照着话术剧本练。"]}, {"type": "points", "kicker": "06", "title": "第六区：训练与微调（8 条）（续）", "points": ["RLHF / DPO / GRPO（对齐三连）", "一句话：让模型\"学好不学坏\"的三代教法。", "展开：RLHF 训练奖励模型打分+强化学习优化（最强但最难调）", "DPO 直接从偏好对学习（免奖励模型，简单）"]}, {"type": "points", "kicker": "06", "title": "第六区：训练与微调（8 条）（续）", "points": ["GRPO 让模型批量做题、组内对比给分、靠\"可验证奖励\"（代码跑测试/数学对答案）自己悟——DeepSeek R1 的…", "记忆锚点：请教练打分 → 看范例自学 → 刷题对答案。", "LoRA", "一句话：冻住原模型，只训一个几十 MB 的小补丁。"]}, {"type": "points", "kicker": "06", "title": "第六区：训练与微调（8 条）（续）", "points": ["展开：权重变化量用低秩矩阵近似（约 0.8% 参数量）。", "一底多补丁、可叠加、可合并零延迟。", "消费级卡几小时训一个画风/角色。", "记忆锚点：游戏 MOD：本体不动装补丁。"]}, {"type": "points", "kicker": "06", "title": "第六区：训练与微调（8 条）（续）", "points": ["QLoRA", "一句话：把原模型压成 4-bit 再挂 LoRA，16GB 卡微调 300 亿模型。", "展开：NF4 格点按正态分布摆（对权重更友好）+双重量化+分页优化器三板斧。", "记忆锚点：mp3 版游戏照样装 MOD。"]}, {"type": "points", "kicker": "06", "title": "第六区：训练与微调（8 条）（续）", "points": ["Gradient Checkpointing（梯度检查点）", "一句话：中间过程别都存着，要用时重算一遍——算力换显存。", "展开：按 √N 间隔存检查点，反传时分段重算，激活显存大降、耗时约 +33%。", "记忆锚点：游戏只存关键节点存档，死了从存档重打。"]}, {"type": "points", "kicker": "06", "title": "第六区：训练与微调（8 条）（续）", "points": ["DeepSpeed / ZeRO", "一句话：多卡训练时把\"账本\"（优化器状态）切开分摊。", "展开：三档渐进——切优化器/加切梯度/加切参数。通信换显存。与 TP 正交可叠加。", "记忆锚点：合伙开店：账本不用每人抄一整本，各记各的页。"]}, {"type": "points", "kicker": "06", "title": "第六区：训练与微调（8 条）（续）", "points": ["知识蒸馏（Distillation）", "一句话：大模型当老师，把\"感觉\"教给小模型。", "展开：学生拟合老师的输出分布（软标签信息量大于硬答案）。投机解码的草稿模型、小而强的开源模型多由此来。", "记忆锚点：名师带徒弟，徒弟学的是判断力不是答案。"]}, {"type": "points", "kicker": "07", "title": "第七区：扩散生成（图/视频/音乐）（7 条）", "points": ["扩散模型（Diffusion Model）", "一句话：学会\"从雪花噪点里显影出图片\"的生成模型。", "展开：训练=给干净图逐步加噪学\"猜噪声\"；生成=从纯噪声按指引逐步擦干净。打倒上一代 GAN 成为主流。", "记忆锚点：照片显影/修复老照片。"]}, {"type": "points", "kicker": "07", "title": "第七区：扩散生成（图/视频/音乐）（7 条）（续）", "points": ["Flow Matching（流匹配）", "一句话：新一代\"擦法\"——学一条从噪声到图片的近直线路径。", "展开：学速度场而非噪声，路径直所以步数少（几十步 vs 几百步）。", "FLUX/Qwen-Image/ACE-Step 全在用。"]}, {"type": "points", "kicker": "07", "title": "第七区：扩散生成（图/视频/音乐）（7 条）（续）", "points": ["记忆锚点：导航选直线快速路而不是盘山路。", "潜空间 / LDM / VAE", "一句话：先压缩成小稿再创作，最后放大回高清。", "展开：VAE 编码器把 512×512 图压成 64×64 潜码（省 48 倍），扩散在潜空间进行，解码器还原。"]}, {"type": "points", "kicker": "07", "title": "第七区：扩散生成（图/视频/音乐）（7 条）（续）", "points": ["VAE 决定细节上限。", "记忆锚点：先画火柴稿，定稿后再上精细墨。", "DiT（Diffusion Transformer）", "一句话：把扩散的骨干网络换成 Transformer（和 ChatGPT 同款）。"]}, {"type": "points", "kicker": "07", "title": "第七区：扩散生成（图/视频/音乐）（7 条）（续）", "points": ["展开：图像切块成 token 序列处理，证明扩散也吃 scaling law——骨干越大越好。视频大模型的架构基础。", "记忆锚点：图像生成也用上了大语言模型的那套骨架。", "CFG（Classifier-Free Guidance）", "一句话：让模型\"更听话\"的技巧——同时算\"看了提示词\"和\"没看\"两个版本，往差值方向用力。"]}, {"type": "points", "kicker": "07", "title": "第七区：扩散生成（图/视频/音乐）（7 条）（续）", "points": ["展开：强度 w≈5-8，忠实度提升但计算翻倍。CFG 蒸馏（CFG-distilled）把它练进模型，省一半。", "记忆锚点： AND 口诀：既要符合要求，又要保有美感，取两者之差。", "ControlNet / 适配器（Adapter）", "一句话：给生成模型外挂\"条件控制器\"——姿势图、深度图、边缘线都能控。"]}, {"type": "points", "kicker": "07", "title": "第七区：扩散生成（图/视频/音乐）（7 条）（续）", "points": ["展开：冻结底模训旁路网络注入控制信号。扩散版的 LoRA 亲戚。", "记忆锚点：给画家递一张参考草图。", "Image-to-LoRA（i2L）", "一句话：给它一张风格图，一步直接产出那个风格的 LoRA 文件。"]}, {"type": "points", "kicker": "07", "title": "第七区：扩散生成（图/视频/音乐）（7 条）（续）", "points": ["展开：图像编码器+可学习查询直接预测 LoRA 权重，小时级训练压缩成秒级推理。输出是标准 LoRA，生态全兼容。", "记忆锚点：把\"学画风\"变成了\"复印画风\"。"]}, {"type": "points", "kicker": "08", "title": "第八区：Agent 与评测（6 条）", "points": ["Agent / Agentic", "一句话：给目标不给步骤，自己拆解-调工具-看结果-修正的循环工作方式。", "展开：核心是 agent loop。与 n8n 工作流的本质区别：运行时自己决定下一步，而非人画死流程。", "记忆锚点：从点菜机升级成私人厨师。"]}, {"type": "points", "kicker": "08", "title": "第八区：Agent 与评测（6 条）（续）", "points": ["工具调用 / Function Calling / MCP", "一句话：模型说\"我要查天气\"，外部程序真去查了再喂回来。", "展开：模型输出结构化调用请求，执行权在外部框架", "MCP 是统一插头标准（一次封装所有 agent 可用）。"]}, {"type": "points", "kicker": "08", "title": "第八区：Agent 与评测（6 条）（续）", "points": ["结构化输出（JSON schema 约束解码）保障格式正确。", "记忆锚点：模型动嘴，插件动手。", "Agent 的上下文重放", "一句话：agent 每走一步都要把全部历史重新讲给模型听。"]}, {"type": "points", "kicker": "08", "title": "第八区：Agent 与评测（6 条）（续）", "points": ["展开：导致输入中位 14 万 token、输入输出比 131:1、96% 前缀重复——这是 agentic servi…", "记忆锚点：每次开会都从头念一遍会议记录。", "子代理（Subagent）", "一句话：主 agent 派出去干脏活的临时工，干完只交摘要。"]}, {"type": "points", "kicker": "08", "title": "第八区：Agent 与评测（6 条）（续）", "points": ["展开：保护主上下文干净 + 子任务上下文短（KV 便宜）。代价是吃不到主 agent 的前缀缓存。", "记忆锚点：经理派实习生跑腿，回来只听结论。", "AgentX / Agentic Bench（基准）", "一句话：给\"模型当 agent 用\"的服务器性能打分的标准化考卷。"]}, {"type": "points", "kicker": "08", "title": "第八区：Agent 与评测（6 条）（续）", "points": ["展开：AgentX 用真实 agent 编码轨迹回放（真实但慢，小时级）", "Agentic Bench 用可控合成负载（快，分钟级，做回归测试）。", "指标看 TTFT/TPOT 的 P50+P99、每任务成本、缓存命中率。", "记忆锚点：驾驶考试：真实路况 vs 模拟器。"]}, {"type": "points", "kicker": "08", "title": "第八区：Agent 与评测（6 条）（续）", "points": ["Prefix 命中率（Cache Hit Rate）", "一句话：来的请求里有多少计算是\"白捡\"的。", "展开：agent 场景 94-96% 意味着只有 4-6% 的输入需要真算。这是 agentic 推理成本的第一杠杆。", "记忆锚点：便利店常客比例——常客越多越省进货。"]}, {"type": "points", "kicker": "09", "title": "首字拼音索引", "points": ["B：Batch、MoE（混合专家见\"M\"）", "C：CFG、ControlNet、TokenSpeed 之外——DDCP 见\"D\"", "D：Decode、DCP、DeepSpeed、Diffusion、DiT、DPO、DPLR", "F：FlashAttention、Flow Matching、FP8/INT4"]}, {"type": "points", "kicker": "09", "title": "首字拼音索引（续）", "points": ["G：GQA、GRPO、GPU 世代、GGUF", "H：HBM", "J：剧集并行见\"EP\"；加速比见\"投机解码\"", "K：KV Cache、KDA/Kimi Linear、KV 传输"]}, {"type": "points", "kicker": "09", "title": "首字拼音索引（续）", "points": ["L：LLM、LoRA、QLoRA、RoPE", "M：MLA、MoE、MCP、Mooncake、MIG、Marconi", "N：NVLink、NVFP4、NTK/YaRN", "P：Prefill、PD 分离、PP、Prefix Cache、PagedAttention、Parameter"]}, {"type": "points", "kicker": "09", "title": "首字拼音索引（续）", "points": ["Q：Q/K/V、QLoRA、Quantization", "R：RLHF、RDMA、RoPE", "S：SFT、SGLang、SLO、Speculative Decoding", "T：Token、TP、TPOT、TTFT、TensorRT-LLM、Transformer"]}, {"type": "points", "kicker": "09", "title": "首字拼音索引（续）", "points": ["W：微分片见\"切分\"；外推见\"RoPE\"", "X：显存、消融见各论文章节", "Y：YaRN、推理/训练各条目见正文", "Z：ZeRO、子代理、自回归、知识蒸馏见\"知\""]}, {"type": "points", "kicker": "10", "title": "学习提示", "points": ["记类比不记定义：每个锚点都是能讲给朋友听的故事，能复述=真懂了", "看名字猜家族：Attention 结尾=注意力家族、-parallelism=并行家族、*-cache=缓存家族", "三篇文档配合用：本文查名词 → 08 看叙事 → 01/02 按编号深挖 → 07 看论文原始数字"]}, {"type": "close", "title": "大模型推理科普手册：专业名词完整版", "ta
