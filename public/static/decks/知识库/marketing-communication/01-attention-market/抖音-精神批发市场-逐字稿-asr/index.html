国、意大利才能改变吗？", "从今天开始，请你每天拉黑75条。", "你就足够优秀了。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["请你注意哦，你只是处在了一个极度消耗你的环境当中，并不代表你这个人不优秀。", "改变互联网冲浪环境，一切都 OK 顺利了。", "花学是绝对不可能让你掉入信息流，成为别人免费的广告位的。", "成为我的就行了。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["开玩笑了，那么我的触发场景就是玩抖音的时候，极端拉黑行为。", "第三个要做的事情就是激发情绪了。", "我相信大家对这方面已经很熟悉了，我简单具体地带过哈。", "强烈的情感反应是一定能够激发人们的分享欲望的，特别是那些高唤醒的情绪，比如说惊讶、兴奋、快乐、愤怒、焦虑等等。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["情绪一定一定是要大过你的文案的，如果你是做短视频的话哈。", "比如说我刚才的那个电子广告，你们要拿去做口播，张口第一句，一个开悟的人只干这五件事，我可能给你打50分吧。", "你的内容是有条理的、清晰的，但是它不够爆。", "短视频它的开头应该怎么改？"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["可以改成这样子。", "朋友们，我刚结束了一个 A10级别的饭局，那个老板跟我讲啊，巴拉巴拉，然后你就开始分享开悟的人做什么事情。", "就这一句话，你看他做了几件钩子和事情啊？", "第一是他是有画面。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["你是在一个高端饭局，第二有身份的一个背书，A10级别，大家都想知道这个圈子里面的人在聊什么，对吧？", "第三个它是有悬念。", "开悟开悟，老板讲的开悟跟我理解的有什么差异吗？", "第四，这是一种比较隐藏的哈，偷听感。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["你刷到这条视频，就是好像不小心可以有机会偷听到那些大佬的一些私房话。", "你肯定是想留住这个注意力，仔细地听一下一些小技巧。", "你的情绪一定要找到对的人和场景，然后你再去抒发。", "比如说，爱艾伦他对标的呃他新号对标那些人啊，有一点小镇作家的意思。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["男性成长博主在 X 等平台上面做一些极端的言论和打法，你会发现他们的目标客户其实就是互联网上体量极其庞大，但是常年又处…", "然后又常年被外部规训惯了的，习惯了标准答案的小镇做题家们。", "这一群人走出考场太多年了，然后一直在，也不停的习惯性的寻找下一场考试。", "还真别说，这可能是一个巨大的，还没被完全深度发掘的精神红利市场。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["嗯，花学的话也可以抄袭啊，就做女性做题家的。", "那我们今天在菜市场怎么卖呢？", "先立自己的牌坊吧，就招牌，你想卖什么菜吗？", "比如说，我先把花学的自己的身份包装成小镇出来的，也是一个独立女性做题家，想跨越阶级，但是早年的时候走了弯路，嫁进豪门生…"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["自己在海外电商做创业，然后开录短视频。", "那我现在开录短视频，我的第一句话就应该是类似于啊，十年前负债100万，被 A12前夫逐出家门，来到澳大利亚重新创业，现…", "这条视频是为我的女儿录的，我只希望她以后步入社会不要走我的弯路。", "巴拉巴拉，开宗立派，花学就起来了。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["挺有意思的吧，很多的成长博主都是这个套路。", "事件越具体，情绪越充分。", "第四点，第四个原则就是保证我卖的产品一定要具有公共性。", "这个逻辑也非常简单，可视性对于口碑传播有巨大的推波助澜作用。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["更容易被看到的事物，就有更多的人去谈论和模仿。", "怎么说呢？", "比如你的大学室友偷偷换了一款牙膏，你看不见，你就不会跟风。", "可他要是把牙膏放在你们的那个洗漱公共台最显眼的位置呢？"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["你就潜移默化的，就记住了这个产品形象。", "你下次去超市逛的时候，看到这个牙膏，你就会，嗯，好像是被触发了什么机关一样的，对它的好感就多一点点，关注度也多一点点。", "人模仿的从来不会说那些特别好的东西，而是你在日常生活中看得见的东西。", "疯传里面有一个经典案例就是 Hotmail 1996年的时候他干了一件事情。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["每个用户使用它去发出的每一封邮件，末尾都会自动带一句 Get your free email at Hotmail。", "用户使用它不用花钱，但是它发的每封邮件就是在给这个产品公司打一次广告。", "使用及传播，用户每使用一次产品就多加一次曝光。", "那知识产品呢？"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["滑雪呢？", "我们要卖的菜，麻烦来了。", "知识看不见，拉黑这个行为又是私密动作，别人也看不见。", "精神产品天生是隐形的。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["那公共性教你的第一课就是学会把看不见的学问变成大众看得见的身份。", "还是老操作，哪些老操作呢？", "首先，造梗嘛，我们第一步可以先在评论区街头，找一些粉丝和兼职的人在评论区去刷，要被上花学了。", "怎么理解被上花雪就是被拉黑？"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["如果你说了一句让人不舒服的话，对方不跟你吵，不跟你辩，直接拉黑，这就是被上花雪了。", "评论区是公开的，粉丝每一次街头路人就看见一次花雪。", "这些暗号就你的广告位啊。", "比如要求他们去评论，这人说话太冲了，要被上花学了。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["评论区已经开始花学我了，求求你别说我了，我怕被上花学。", "每一句都是一个公开展示，别人看不懂就会去搜，搜了自然就进来了，引流了。", "第二就是做一些极端的曝光。", "拉黑这个行为是私密的，但是你晒这个知识的行为是公开的，互联网上人必须有点大病才能爆火，太正常的人没人记得住你，你得极端…"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["所以花学的晒法是，你可以找人去做。", "一些很反黑或者受人喷嘲笑的帖子。", "比如今天拉黑75个领导，虽然工作没了，但我已经走向了花学拉黑即成功的路径。", "你看，这样他就把花学的核心精髓从一个防御性、私密性的行为变成了一个攻击性、公开性、招笑的表演，对吧？"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["可以被模仿的这种行为。", "一旦晒出来，点赞量高，模仿的人数一多，自然就形成了一种风气。", "然后第三步就顺水推舟嘛，可以搞一些语录啊、卡片啊、表情包啊，做一些魔音图，对吧？", "疯传当中的第五个原则就叫做实用价值。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["传统意义上解释这个很简单，比如说哈，市面上各种，三天教你学会剪辑，五天速通蛙泳。", "两小时掌握副业变现等等。", "可是在今天这个注意力被严重透支，人均重度内耗的时代，我们得重新定一下这个价值了。", "怎么定义？"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["我想告诉你的是情绪上的有用，比功能上的有用更有价值，更值钱。", "你仔细想想嘛，很多人去学剪辑或报班 AI 课之类的。", "他可能不是因为这个课程多好，他其实只是想买，就是那种我在行动，我不可以一直这么焦虑的感觉。", "你觉得它有用它就有用，你觉得它没用它就没用啊，它就是这样的一个很主观化、情绪化的判断标准，都是为情绪在服务的。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["这是从买方啊，买白菜的那边的人的视角来跟大家解释。", "那我们这些，你准备想摆摊的人哈。", "你该卖什么东西？", "我先给大家讲一个词，叫做知识诅咒。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["因为一旦我喊你出来摆摊的话，你就会给我找，就是成千上万种借口。", "说所有赛道都饱和了，现在保住，对吧？", "这个就是为什么我要跟你讲这个概念了。", "因为你总是觉得你懂的东西别人也懂。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["跟你分享一个经典的笑话，雷军在发布会上宣布我们的手机镜头采用了极其先进的四层光学玻璃。", "周鸿祎在台下听完问身边的工程师，哇，他们怎么这么厉害？", "那我们的手机有几层呢？", "工程师回答，老板，所有的手机镜头本来就是四层。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["这就是典型的知识诅咒式营销。", "工程师知道这是常识，但是老板和用户不知道啊。", "谁掌握了四层玻璃这个说法，谁就可以把这种隐蔽的常识变成他的卖点，对不对？", "那你看邵艾伦的搏击理论也是一样的。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["健身教练觉得增肌减脂这些事情早就讲烂了，讲得多了没什么好讲的。", "但是你无法阻挡市场里面永远有新人过来呀，他没有接触过健身概念，不知道什么叫体脂率。", "无氧有氧，当然他可以去网上搜到，对不对？", "所以你就需要造一个新的概念和新词来告诉他们怎么解决这些焦虑，对吧？"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["薄肌就是这个词，新瓶装旧酒嘛。", "那你像女生之前玩瑜伽，现在练普拉提，反正都是运动消费嘛，一样的。", "不要总觉得就是赛道饱和，你就不做了，因为你站在的是懂得的人这一边，可是另一边永远有一些新鲜的血液走进来。", "你想卖什么都可以去做，大胆去做，找对人群，卖给不懂的就行了。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["让用户觉得拿到你这个概念，拿到这个词，这个技能，就像拿到一把钥匙。", "开不开门不重要，重要的是他有安全感了，他手里面有钥匙了。", "那比如说我卖花学的话，那我肯定不会就傻愣愣的直接教你传播学的公式啊，那谁不会，你直接去图书馆各大教材里面全都有，直接去…", "所以你要卖知识产品，比如说化学的话，那你卖的是一种立场，一个活人的观点。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["比如我今天直接在这里抛一个暴论。", "在现在这个注意力经济时代，年轻人、老年人，我也不管你之前在大学里学的什么专业，我都强烈建议你现在自学一点传播学，因为知…", "谁才能实现更好的变现。", "这就是我们这门学问的价值观。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["你觉得对就拿走，你觉得不对的话就全当我胡说八道，我也没有任何损失，对吧？", "好，我讲这个是希望大家知道。", "现在某个概念会爆，更多的是源于许多人还在找出路，希望以及在他们的生活中做具体决策的推手。", "如果你要在精神菜市场摆摊的话，那你更多承担的角色肯定是别人赛博路上面的人生参谋。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["当然你自己脑子里面有点存货，不然你都是一次性的消费，你是没有回头客，而且口碑不会好。", "最后一个原则叫做特洛伊木马，也就是说会讲故事。", "你的产品信息广告要传得远，必须要依赖故事。", "因为人们对理论概念的记忆程度是很浅的，但他会记得一些精彩绝伦的故事。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["故事是概念的壳，概念是故事的核。", "比如说你要开什么心理诊所，你直接讲人应该屏蔽焦虑，没有人理你的，但是你去分享一个具体的人，呃，一个高中生怎么从双向情感…", "别人听完了，会替你讲的，会替你转发和分享的。", "那又比如商界里面的讲故事，概念故事哈。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["秋天的第一杯奶茶，几个厂家弄出来的词条，连当季的产品都没做好，只有这么一个仪式的故事，一年说个一次。", "你看，故事才是最好的货架，故事讲得好就可以定义社会和规则。", "中国最伟大的故事家是谁？", "司马迁。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["最伟大的系列故事是二十四史。", "司马迁他能够用一个个具体的人，事，还有细节去把3000年的历史装进130篇的列传里面。", "那你知道我今天为什么做这样的一个话题分享吗？", "也是因为前阵子在线下参加了一个小会，一家大家耳熟能详的国内的老牌金店的老总啊，他跟我们讲遇到了一个转型的问题。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["以前的消费者都是家庭主妇、贵妇啊之类的，现在想做一些轻量化的年轻人生意，或者直接开一个子品牌嘛，重新去找代言人，重新做…", "我们就拿一些之前的案例，结合一些原则爆款思路，策划给他看。", "顺便呢，我就轻量化的也在自己的社交平台给大家分享一下这些玩法和思路。", "好了，我编不下去了，这就是第六个原则，讲故事。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["我刚才上面说的那么一通，具体的细节都是在包装，讲一个好的故事，让你对我这个人和我要提供的产品产生一种信任，对吧？", "就是要这样婉转地去说服对面的人。", "不过我们最近在做一个品牌的研究，倒是真的，这个就不跟大家透露了。", "谢谢各位今天光临我的互联网菜市场摊位。"]}, {"type": "points", "kicker": "", "title": "要点（续）", "points": ["我也差不多该收摊洗洗睡了，下期见。", "一个开悟的人，只干这五件事，运动健身、投资搞钱、学会复利。", "清淡饮食，学习花学。"]}, {"type": "quote", "text": "来源：抖音 @常见老花，视频 7685400988232462516，18:46，2026-09-14 发布"}, {"type": "close", "title": "老花播客第22集《整个抖音就是体量最大的\"精神批发市场\"》逐字稿（ASR 转写存档）", "takeaways": []}], "accent": "#2f6db3", "title": "老花播客第22集《整个抖音就是体量最大的\"精神批发市场\"》逐字稿（ASR 转写存档）", "seed": 3898, "home": "../../../../../../", "article": "../../../../../../知识库/marketing-communication/01-attention-market/抖音-精神批发市场-逐字稿-asr.html"}</script>
