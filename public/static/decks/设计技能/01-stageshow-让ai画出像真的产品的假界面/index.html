目录，15 篇手艺笔记。", "克制、字体、间距、图标、颜色、动效、取景、网格、标注、拍摄，每篇都写明规则和原因。", "比如\"灰条不要放在视线落点，填充物归边缘\"", "比如金额数字的符号和数字要对齐方式一致。"]}, {"type": "points", "kicker": "04", "title": "四、拆开看：五层结构（续）", "points": ["第三层是 examples 目录，69 个样例，这是它的主仓。", "个金样例各配一句\"该学什么\"，从表单报错到日历拖拽到 AI 流式回答", "个真实产品研究，Figma、Linear、Slack、Raycast、Notion 的界面再现", "还有规格样张当零件目录。"]}, {"type": "points", "kicker": "04", "title": "四、拆开看：五层结构（续）", "points": ["旁边 teaching 目录放着成对的坏样例和改好的版本，专门用来对照诊断。", "第四层是 kit 目录，相当于半成品厨房。", "React 组件库：固定尺寸的舞台、浏览器和手机窗口框、四种光标、推拉镜头、亮暗蓝图玻璃四套配色。", "全走 design token，能映射成你自己产品的样式。"]}, {"type": "points", "kicker": "04", "title": "四、拆开看：五层结构（续）", "points": ["第五层是 scripts 目录，出餐检查。", "film.mjs 把动画拍成带可测报告的连拍图，jumps.mjs 抓单帧跳变，layout.mjs 查文字溢出。", "为什么要拍而不是看截图？", "作者的理由：读代码或看一张静止画面，抓不到动效的毛病——比如某个胶囊按钮进场时跳了 4 像素，或者某一帧整个画面突然消…"]}, {"type": "points", "kicker": "05", "title": "五、实测记录：真跑了一遍", "points": ["安装一条命令，然后起预览服务、拍金样例。", "我选的样例叫 hero-demo，先看静帧——灰色占位条铺满画面，真字只出现在故事落点（\"Maya's Dashboa…", "这个\"真字省着用\"的处理，正是普通 AI 生成最容易翻车的地方。", "完整拍摄会输出一张 36 帧的连拍图，18 秒的故事完整铺开：工具栏浮现、弹窗里逐字打出\"Change to prim…"]}, {"type": "points", "kicker": "05", "title": "五、实测记录：真跑了一遍（续）", "points": ["每一帧的动效都有原因，循环结尾回到开头。", "最意外的发现在自检环节。", "跑它的正式验收闸门（--gate），作者自己的金样例 hero-demo 没过：6 条\"永不该出现\"的判定，包括按钮离…", "另两个金样例倒是过了。"]}, {"type": "points", "kicker": "05", "title": "五、实测记录：真跑了一遍（续）", "points": ["这个仓库 2026-10 底刚发布，主分支只有 1 个提交，样例和检查器之间有漂移。", "它给自己的定位倒是很诚实：闸门是必要条件不是充分条件——检查抓错误，不抓无聊。"]}, {"type": "points", "kicker": "06", "title": "六、上手卡（可照抄）", "points": ["环境要求：本机装 Node 22.20 以上（技能本体要 20.19 以上）、有 Chrome。三条命令", "npx skills add benjitaylor/skills --skill stageshow -g", "cd ~/.agents/skills/stageshow && npm install && npm run dev", "node scripts/film.mjs \"http://stageshow.localhost:1355/?"]}, {"type": "points", "kicker": "06", "title": "六、上手卡（可照抄）（续）", "points": ["capture=hero-demo\" \\", "--select '#example' --gate --out sheet.png", "在 Agent 对话里触发它，直接说需求就行：\"用 stageshow 给 XX 产品做一张 hero 图，浅色，要有…", "\"它的触发条件写得很宽，哪怕不提\"假 UI\"三个字，你说\"产品演示动画\"\"功能卡片插图\"它也会接住。"]}, {"type": "points", "kicker": "06", "title": "六、上手卡（可照抄）（续）", "points": ["许可证是 MIT，唯一例外见下一节。"]}, {"type": "table", "kicker": "07", "title": "", "headers": ["技能", "管什么", "什么时候用"], "rows": [["impeccable", "设计全流程总监，45 条无 LLM 检测", "做真前端页面时的默认设计把关"], ["hallmark", "反 AI 味规则手册", "要个性化、怕撞模板时点名用"], ["anatomy", "等距 SVG 剖面图解", "讲原理的插图（设备、结构）"], ["video-shot-demos", "一镜一分镜的演示动画", "汇报演示、讲解动画"], ["stageshow", "假产品 UI 插图与光标演示", "营销页配图、功能卡片、文档首图"]]}, {"type": "points", "kicker": "07", "title": "七、和其它设计技能怎么分工", "points": ["一句话分工：做真页面找 impeccable 把关，要\"看起来像产品\"的图找 stageshow。", "它和你现有技能不抢活，因为产出物完全不同——它是画出来的插图，不是代码组件。"]}, {"type": "points", "kicker": "08", "title": "八、三个坑（买前须知）", "points": ["坑一：样例和检查器会漂移。", "仓库刚发布，主分支只有 1 个提交，作者金样例没过自家闸门这件事就是证据。", "用它之前，先对你选的金样例跑一遍 --gate，记下基线，别拿\"闸门通过\"当质量证书。", "坑二：图标版权有例外。"]}, {"type": "points", "kicker": "08", "title": "八、三个坑（买前须知）（续）", "points": ["样例里用的 Figma、Slack 等真实应用图标是从对方安装包里提取的美术资源，NOTICE.md 明说这些不在 M…", "对外商用发布时，换掉这些图标。", "坑三：它有明确的能力边界。", "不画插画、不做摄影"]}, {"type": "points", "kicker": "08", "title": "八、三个坑（买前须知）（续）", "points": ["检查只抓错误不抓无聊，过闸门的 demo 依然可能乏味", "作者自己也预言这类技能\"只能有用一阵子，很多东西很快会内置进模型\"。", "把它当加速器，别当自动出图机。"]}, {"type": "table", "kicker": "09", "title": "", "headers": ["问题", "答案"], "rows": [["它是什么", "让 AI 生成逼真假产品界面（静态图或十几秒光标动画）的 Agent 技能"], ["产出形态", "React 加纯 CSS 的插图组件，配拍摄自检报告"], ["成本", "MIT 免费；需要 Node 22+ 和 Chrome；拍摄靠 playwright"], ["最独特的设计", "金样例起步（复制改皮不重写）加连拍自检（抓人眼会漏的动效毛病）"], ["适用场景", "营销页配图、功能卡片、文档首图、bento 网格"], ["不适用", "真前端组件、插画摄影、需要真实数据的截图"]]}, {"type": "points", "kicker": "09", "title": "九、总结与行动清单", "points": ["行动清单", "先装后看：跑上面三条命令，亲手拍一个金样例，感受静帧和连拍图的差距", "给自己产品试一张：把产品配色映射进 token（references/looks.md 有方法），出一张功能卡片", "用 --gate 加人眼复检双闸门收货，别只信机器判定"]}, {"type": "points", "kicker": "09", "title": "九、总结与行动清单（续）", "points": ["商用发布前查 NOTICE.md，换掉真实产品图标", "最后收个尾。", "这个技能真正值得学的不只是\"怎么画假界面\"，而是它的做法本身：AI 缺的从来不是手艺，而是被写下来的品味。", "把\"为什么假\"拆成一条条可执行的规则，把\"什么叫对\"存成一格格样例，再配一台会挑毛病的摄像机，AI 就能照着做对——这…"]}, {"type": "close", "title": "AI 画的界面一眼假？有人把设计师的品味拆
