结合位点", "自己挑工具", "自己跑流程"]}, {"type": "points", "kicker": "03", "title": "门里的人在干什么（续）", "points": ["自己从失败里爬出来", "十四个蛋白质靶点，九个出了强候选。这套活，原本从头到尾是科学家的。", "两个案例都震撼。但你把它们并排放，会看见一条裂缝。", "前传讲过一个朴素的经济学"]}, {"type": "points", "kicker": "03", "title": "门里的人在干什么（续）", "points": ["当年我说，执行免费了，判断变贵了。现在这句话要往前再推一格——", "重构已知，正在免费。一天五千万行，这件事的价格已经砸穿地板。", "创造未知，真正在涨价的是这一头。", "而绝大多数人，正在用神灯擦灯。"]}, {"type": "points", "kicker": "03", "title": "门里的人在干什么（续）", "points": ["先别急着喊口号。\"要创造未知\"这种话，跟\"要财务自由\"一样，人人会说，说完没有任何东西发生。", "有用的问题是反过来问的：一个手里握着史上最强工具的人，为什么还是只会重构已知？", "我想了很久。答案不在能力上，在坐标系上。"]}, {"type": "quote", "text": "重构已知 vs. 创造未知"}, {"type": "points", "kicker": "04", "title": "重构已知的坐标系", "points": ["重构已知，自带一套完整的坐标系。它有三样东西", "参照物——旧系统就在那儿，对错有标准答案，迁移完的代码跑不跑得通，跟旧的比一下就知道。", "验收人——终点总有一个人、一套测试、一个老板等着说\"行了\"。", "回滚键——搞砸了，退回去重来，损失可控。"]}, {"type": "points", "kicker": "04", "title": "重构已知的坐标系（续）", "points": ["这三样东西合起来，给人一种深入骨髓的安全感。", "你从上学第一天起就活在这套坐标系里：题目有标准答案，卷子有人批改，错了下次再考。", "上班之后还是它：需求有人提，验收有人管，搞砸了写复盘。", "十几年训练下来，人会形成一种本能——没有这三样东西，手就不知道往哪放。"]}, {"type": "points", "kicker": "05", "title": "创造未知：三样全无", "points": ["而创造未知——", "❌ 没有参照物——你要做的东西以前不存在，没有\"旧版\"可以比对", "❌ 没有验收人——没人能告诉你这个东西算不算成，因为没人见过它该长什么样", "❌ 没有回滚键——你投进去的时间和名声，退不回来"]}, {"type": "points", "kicker": "05", "title": "创造未知：三样全无（续）", "points": ["所以绝大多数人不碰未知，跟勇气没关系，跟智商更没关系。", "是他们一辈子被训练在一套有标准答案的坐标系里干活，一旦走出坐标系，整个人是悬空的。", "AI 再强也救不了这个，因为 AI 解决的是\"怎么做\"，而悬空的人卡死在前一个问题上", "重构已知的世界里，\"什么算对\"是别人定好的，你只管够到它。创造未知的世界里，\"什么算对\"必须你自己定。"]}, {"type": "points", "kicker": "05", "title": "创造未知：三样全无（续）", "points": ["定了，机器军团就有了方向，一天五千万行的怪物就成了你的施工队。", "不定，再强的军团也只是在你身边空转——或者更糟，替你高速地奔向一个你根本没想清楚的地方。", "所以创造未知的第一步，跟工具无关，跟模型无关。是把\"什么算对\"的定义权，从别人手里拿回来。", "谁专门干\"定义什么算对\"这件事？"]}, {"type": "points", "kicker": "05", "title": "创造未知：三样全无（续）", "points": ["这个问题，把我们带到这两年最古怪的一条招聘新闻面前。", "前阵子刷到一个视频，一个建筑学博士讲的：AI 公司开始招哲学家了，未来需要专才还是通才。", "事实部分他没讲错。我去核了一遍，比他讲的还夸张。", "📍 几个事实"]}, {"type": "points", "kicker": "05", "title": "创造未知：三样全无（续）", "points": ["Google DeepMind 今年聘了剑桥的心灵哲学家 Henry Shevlin， , "points": ["但到这里，法管的还是一个已经存在的东西。创造未知，意味着你要让一个不存在的东西出生。"]}, {"type": "quote", "text": "铁律"}, {"type": "points", "kicker": "20", "title": "绝大多数人的做法", "points": ["这个动作本身，就是把重构已知的习惯，原封不动地带进了未知的领地。", "因为\"直接开干\"回答的是\"怎么做\"——那是他们这辈子唯一被训练过回答的问题。", "而一个未知的东西，在\"怎么做\"之前，有一整排没人替你回答的问题堵在门口。", "绕过它们开干，等于带着一支军团出征，却没人知道为什么打、打到什么算赢、谁有权下令撤退。"]}, {"type": "quote", "text": "有了个想法，热血上头，直接开干。"}, {"type": "points", "kicker": "21", "title": "七问创世清单", "points": ["我给自己立了一份创世清单。", "任何一个新东西——一个项目、一个产品、一个组织——清单上七个问题答不全，不许启动。", "一个都不许缺。", "一问：为什么存在"]}, {"type": "points", "kicker": "21", "title": "七问创世清单（续）", "points": ["二问：死也不越的底线", "这两问就是第五章的创世层，根，刻石头上。", "三问：现在要达成什么", "初始目标。"]}, {"type": "points", "kicker": "21", "title": "七问创世清单（续）", "points": ["目标和存在理由的区别前面讲过：理由刻在石头上，目标住在可变层里。", "但可变层也得有东西——一个只有宏大愿景、没有第一个具体目标的东西，是一团雾。", "雾里出不了兵。", "四问：谁拍板"]}, {"type": "points", "kicker": "21", "title": "七问创世清单（续）", "points": ["谁有权做不可逆的决定？ 一个人，还是几个人？各管哪块？", "这一问看着像废话，但你去数数，合伙散伙的案子，九成死在这一问没有提前答。", "顺的时候谁拍板都行", "不可逆的关口一到——融不融、卖不卖、散不散——没提前写下来的拍板权，当场变成战场。"]}, {"type": "points", "kicker": "21", "title": "七问创世清单（续）", "points": ["五问：它活在什么环境里", "市场、社群、内容、交易？", "环境决定这个东西需要长什么感官、什么器官。", "一个做交易的系统和一个做社群的系统，连\"危险\"这个词的定义都完全两样。"]}, {"type": "points", "kicker": "21", "title": "七问创世清单（续）", "points": ["六问：什么算好", "判断法典的种子，第六章教过怎么抠。", "出生的时候不用全，三五条就够，但必须有——没有判断种子的系统，出生第一天就开始借别人的标准给自己打分。", "七问：资源边界"]}, {"type": "points", "kicker": "21", "title": "七问创世清单（续）", "points": ["钱的预算，和一个比钱硬得多的预算：你的注意力。", "前传第五章讲过判断力的分配，创世的时候就要白纸黑字写下：这个东西，每周配得到我几个小时的深度思考。"]}, {"type": "quote", "text": "写不出这个数字的项目，多半是叶公好龙——你爱的是\"拥有它\"的感觉，不爱养它。"}, {"type": "points", "kicker": "22", "title": "最后一个动作：缺口分析", "points": ["七问答完，对着答案问", "让一个系统从出生的第一刻，就知道自己缺什么——这比任何执行技巧都值钱。", "出生只是起点。这一章讲法的最高境界：让系统自己长。"]}, {"type": "quote", "text": "要让这个东西活起来，需要哪些角色？"}, {"type": "points", "kicker": "23", "title": "天花板", "points": ["先回到我的站群。", "前传说过，两千个站，本质上我写的是\"能生产站的系统\"。", "但那套东西有个天花板，当年我看不见，现在看得很清楚", "环境一变，新的能力——新的采集方式、新的内容形态、新的风控——全要我亲手往里加。系统自己长不出新器官。"]}, {"type": "points", "kicker": "23", "title": "天花板（续）", "points": ["最高级的法，要解决的就是这个：让系统在法的约束下，自己长出它需要的能力。"]}, {"type": "quote", "text": "它能生产，不能进化。"}, {"type": "points", "kicker": "24", "title": "年的现实", "points": ["这话搁两年前是玄学，2026 年已经一点不玄了。", "去年 12 月，Anthropic 发布了一个开放标准，把\"一项能力\"定义成一个文件夹：一份机器读的元数据，一份人读的…", "小时内微软和 OpenAI 跟进", "三个月内三十多个工具采纳"]}, {"type": "points", "kicker": "24", "title": "年的现实（续）", "points": ["市面上这种能力文件已经数以十万计", "这个标准最妙的地方在于，它催生了\"生成能力的能力\"——一个 agent 可以按需写出新的能力文件，装给自己，或者装给别…", "但正因为长器官变得免费，立法者必须管住两头。管不住，系统不会长成生命，会长成肿瘤。"]}, {"type": "quote", "text": "翻译"}, {"type": "points", "kicker": "25", "title": "管住第一头：按需生长，不预装", "points": ["这两年做多 agent 系统的人，用一地尸体换来一条教训：这类项目最主要的死法，是为不存在的复杂度，提前修建基础设施。", "一群人兴冲冲搭了十几个 agent 的恢弘架构，跑起来发现一个 agent 加几个文件就够了，剩下的全是要喂、要养、要…", "生长的反面也要写进法里", "会生，也要会死——第七章的死亡条款，在器官层面再复刻一遍。"]}, {"type": "quote", "text": "一个系统默认要多小有多小；撞到墙了，缺口被证实了，才长新东西。"}, {"type": "points", "kicker": "26", "title": "管住第二头：长出来的东西，必须过门", "points": ["系统可以自己怀孕，但出生证必须你签。", "这道门一松，你会在某天早上醒来，发现你的系统里长满了你不认识、不理解、也不再受法约束的东西。"]}, {"type": "quote", "text": "任何自动生成的新能力，先当草案，过校验——"}, {"type": "points", "kicker": "27", "title": "同一个姿势，连抬三层", "points": ["前传： 站在代码的上一层，写生成代码的东西", "游戏人生： 站在行为的上一层，设计让人自己动起来的场", "现在： 站在能力的上一层，写规定\"系统按什么规则给自己长能力\"的法", "每抬一层，你亲手干的事少一截，你那部法管的范围大一圈。"]}, {"type": "points", "kicker": "27", "title": "同一个姿势，连抬三层（续）", "points": ["抬到头，是一句创世式的疯话", "而那两份文档，机器替你写不了。机器什么都能替你写，唯独不能替你决定", "讲到这里，机器那一侧的法，骨架齐了。但你的世界里还有另一类存在：人。"]}, {"type": "quote", "text": "终极形态"}, {"type": "points", "kicker": "28", "title": "切一刀：你能控制的 vs. 你不能控制的", "points": ["游戏人生里分过玩家和 NPC。这里要再切一刀，切在 NPC 内部", "Agent：你能控制的", "你生成它，配置它，它跑偏了你重置它，不需要了你下线它。对它，法就是它的全部世界，写什么它执行什么，谈不上委屈。", "人：你控制不了"]}, {"type": "points", "kicker": "28", "title": "切一刀：你能控制的 vs. 你不能控制的（续）", "points": ["一个都控制不了。", "成员、客户、伙伴、对手——你对他们的全部权力，只有三样", "观察——他做了什么", "判断——他是什么样的人、下一步可能往哪动"]}, {"type": "points", "kicker": "28", "title": "切一刀：你能控制的 vs. 你不能控制的（续）", "points": ["尝试调动——调动他要花多少交情、多少利益、多少故事", "仅此而已。", "指令清晰没有用。机器才靠指令运转。"]}, {"type": "quote", "text": "把人当 agent 指派——\"你，执行这个\"——在我的法里有个专门的罪名，叫范畴错误。犯这个错的人，轻则被阳奉阴违，重则众叛亲离，而且他到死都想不通：我的指令明明很清晰。"}, {"type": "points", "kicker": "29", "title": "调动的算账", "points": ["对人，你手里只有调动。而调动是一门有成本的生意，能算，也必须算。", "我的算法很土", "交情是个账户，每一次开口都是支取，光取不存，账户清零。", "把这笔账写进法里，你至少不会犯那个最败家的错：把十年的交情，挥霍在一件不值的小事上。"]}, {"type": "quote", "text": "调动价值 = 能带来的价值 × 够得着的程度 × 关系健康度 - 调动成本"}, {"type": "points", "kicker": "30", "title": "人到底靠什么？", "points": ["可光会算账，还不够。账只能告诉你能调动谁，回答不了人为什么愿意被你调动。", "这就要回到\"神话\"这个词本身了。它的希腊文原文是 mythos，本义朴素得很：讲出来的话，一个故事。", "在还没有成文法的年代，把一群人凝聚起来的，从来都是故事——我们是谁，我们从哪来，我们为什么值得一起受苦。"]}, {"type": "quote", "text": "摩西给以色列人的，法版只是后一半；前一半是出埃及的故事。没有那个故事，法版就是两块石头。"}, {"type": "points", "kicker": "31", "title": "一个完整的立法者，要写两部东西", "points": ["前传结尾我说过，机器能复刻走我的一切技术，唯独复刻不走人和人之间的东西。现在可以把那句话补完了", "照例，丑话说在前面：立法没有速成。它跟前传那四种思维一样，是用时间和坑喂出来的。", "但练的方向有，六个，今天就能开始。"]}, {"type": "quote", "text": "两部法"}, {"type": "points", "kicker": "32", "title": "一、练定义权", "points": ["下次接到任何一个任务，动手之前加问一句：这件事\"什么算对\"，是谁定的？", "如果是别人定的——把标准复述一遍，确认你够的是真靶子。你会惊讶有多少活，干的人和验收的人脑子里装的是两个靶子。", "如果发现根本没人定过——恭喜，你撞到了一块无主之地，这正是立法者下笔的地方。"]}, {"type": "quote", "text": "这个问题问上一个月，你会开始满世界看见悬而未决的\"什么算对\"。它们一直都在，只是过去对你是隐形的。"}, {"type": "points", "kicker": "33", "title": "二、写创世层", "points": ["给你最重要的那个东西，答两问：为什么存在，死也不越过的底线。", "三句话以内，然后做第五章那个陌生人测试。"]}, {"type": "quote", "text": "写不出来不丢人——丢人的是带着一群人和一群机器狂奔，而创世层是空的。"}, {"type": "points", "kicker": "34", "title": "三、抠判断法典", "points": ["十个最近的判断，每个逼出一句\"凭什么\"，人话一句，机器话一句。", "写到第七八个你会想放弃，因为把直觉解压缩成语言是真的痛。", "撑过去。", "这十句话，是你第一部法典的种子，也是你第一次亲眼看见，自己的判断力长什么样。"]}, {"type": "points", "kicker": "35", "title": "四、补死亡条款", "points": ["挑一个你正在养的、隐隐觉得不对劲的东西——项目、习惯、合作、策略——写下它的死亡条件：出现什么，我承认它失败。", "写完贴在你天天看得见的地方。三个月后回头看，你会感谢现在这个还清醒的自己。"]}, {"type": "points", "kicker": "36", "title": "五、拆一部法", "points": ["找一部真实存在的法，用这一篇教的三块骨头解剖它", "哪几条是刻在石头上的根？", "哪些是在进化的判断？", "有没有死亡条款？"]}, {"type": "points", "kicker": "36", "title": "五、拆一部法（续）", "points": ["美国宪法可以，你们公司的价值观手册可以，那份 84 页的 AI 宪法更可以。"]}, {"type": "quote", "text": "拆上两三部你会发现，好法和烂法的差距肉眼可见"}, {"type": "points", "kicker": "37", "title": "六、讲一次神话", "points": ["找一件你想拉人入伙的事，禁止自己罗列收益和分工，只许讲故事", "讲给一个人听，看他的眼睛。", "眼睛亮了——你的神话成立", "没亮——回去重写"]}, {"type": "points", "kicker": "37", "title": "六、讲一次神话（续）", "points": ["收线。", "回到 6 月 9 号那两个名字。", "Anthropic 画的那条线——谁能用神话版——不归你管，也不值得你焦虑，技术的门票永远在降价。", "真正的那道门，现在可以说破了"]}, {"type": "points", "kicker": "37", "title": "六、讲一次神话（续）", "points": ["寓言和神话，差的从来只有一件事。", "寓言里，故事是别人讲的，寓意是别人给的，你听得很认真，还做了笔记。", "神话里，故事是你讲的——讲给机器听，它们照着执行；讲给人听，他们愿意跟你走。", "在那之前，你可以先做一件不需要任何工具、不需要任何权限、不需要排队等任何发布会的事。"]}, {"type": "points", "kicker": "37", "title": "六、讲一次神话（续）", "points": ["它是一切创世的第一行", "写不出来的人，拿着再强的模型，也只是寓言里一个听故事的人。", "写出来的那一刻——"]}, {"type": "quote", "text": "我们是谁，这件事成了，世界会有什么不同，为什么是我们。"}, {"type": "close", "title": "构架师教程：神话时代", "takeaways": ["——构架师系列 · 第二篇", "先看一组数据", "门里的人在干什么"]}], "accent": "#4a8a5c", "title": "构架师教程：神话时代", "seed": 5733, "home": "../../../../", "article": "../../../../链接情报/10-构架师教程-神话时代-全文.html"}</script>
